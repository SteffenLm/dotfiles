# Default theme. The optional state file overrides it after `alacritty-theme`
# selects another palette; missing imports are skipped by Alacritty.
[general]
import = [
  "~/.config/alacritty/themes/retro-82.toml",
  "~/.local/state/alacritty/current.toml",
]

[window]
padding = { x = 14, y = 14 }

[font]
size = 9.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[cursor]
style = { shape = "Block", blinking = "Off" }
