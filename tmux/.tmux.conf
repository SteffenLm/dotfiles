# ── General ───────────────────────────────────────────────────
set -g mouse on
set -g history-limit 5000
set -g renumber-windows on
set -g default-terminal "tmux-256color"
set -sg escape-time 10
setw -g mode-keys vi

# ── TPM plugins ───────────────────────────────────────────────
set -g @plugin 'hiroppy/tmux-agent-sidebar'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tpm'

# ── Catppuccin ────────────────────────────────────────────────
# mocha = dark default; toggle light with `prefix + m`
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_window_flags "none"
set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_middle_separator " "
set -g @catppuccin_status_right_separator "█"
set -g @catppuccin_pane_left_separator "│"
set -g @catppuccin_pane_middle_separator "│"
set -g @catppuccin_pane_right_separator "│"

# Toggle latte (light) / mocha (dark)
bind m run-shell "~/.config/tmux/toggle-flavour.sh"

# TPM init — keep these lines at the bottom of tmux.conf
run '~/.tmux/plugins/tpm/tpm'
run '~/.tmux/plugins/tmux/catppuccin.tmux'
